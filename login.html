<!DOCTYPE html> 
<html lang="pt-br"> 
<head> 
    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <meta name="author" content="Josias Wagner"> 
    <title>Joshebet</title> 
    <link rel="stylesheet" href="style.css"> 
</head> 
<body> 
    <header> 
        <h1>Cadastre-se</h1> 
    </header> 
    <main id="login-page"> 
        <br> 
        <br> 
        <label for="name">Nome Completo:</label> 
        <br> 
        <input type="text" id="name"> 
        <br> 
        <label for="cpf">CPF:</label> 
        <br> 
        <input type="text" id="cpf" placeholder="Somente números" inputmode="numeric"> 
        <br> 
        <label for="end">CEP:</label> 
        <br> 
        <input type="text" autocomplete="postal-code"> 
        <br> 
        <label for="email">Email:</label> 
        <br> 
        <input type="email" id="email"> 
        <br> 
        <label for="password">Senha:</label> 
        <br> 
        <input type="password" id="confirm-password"> 
        <br> 
        <label for="nameu">Nome de Usuário:</label> 
        <br> 
        <input type="text" id="nameu"> 
        <br> 
        <div class="campo">  
        <label for="imagemuser" class="upload-imagem">
                📷 Escolha uma imagem
        </label> 

        <input type="file" id="imagemuser" accept="image/*">  
        <img id="preview-imagem" src="" alt="Pré-visualização da imagem">
    </div> 
        <br> 
        <br> 
        <button id="register-button">Cadastrar</button> 
    </main> 
    <footer id="rodape"> 
        <p>&copy; 2024 Joshebet. Todos os direitos reservados.</p> 
    </footer>
    <script src="script.js"></script>
</body> 
</html>
